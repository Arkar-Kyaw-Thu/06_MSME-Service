<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Inventory</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background-color: #f0f2f5;
    }

    .sidebar {
      width: 220px;
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      position: fixed;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 100%;
      text-align: center;
      margin-bottom: 40px;
    }

    .logo img {
      max-width: 100%;
      height: 60px;
      object-fit: contain;
    }

    .nav-links {
      width: 100%;
    }

    .nav-links a {
      display: block;
      color: #ecf0f1;
      text-decoration: none;
      padding: 12px 20px;
      margin-bottom: 10px;
      border-radius: 4px;
      transition: 0.3s;
    }

    .nav-links a:hover, .active {
      background-color: #34495e;
    }

    .main {
      margin-left: 220px;
      padding: 20px;
      flex-grow: 1;
    }

    .card {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .add-button {
      float: right;
      padding: 6px 12px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-button:hover {
      background-color: #27ae60;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ccc;
      white-space: nowrap;
    }

    th {
      background-color: #ecf0f1;
    }

    .action-button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      margin-right: 5px;
    }

    .action-button.order {
      background-color: #3498db;
    }

    .action-button.edit {
      background-color: #f39c12;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-form {
      background: #fff;
      width: 400px;
      max-width: 90%;
      margin: 100px auto;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .modal-form h3 {
      margin-bottom: 15px;
      font-size: 20px;
      color: #2c3e50;
    }

    .modal-form input[type="text"],
    .modal-form input[type="number"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .modal-form .form-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-form button {
      padding: 10px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal-form .save {
      background-color: #3498db;
      color: white;
    }

    .modal-form .cancel {
      background-color: #e74c3c;
      color: white;
    }

    .modal-overlay {
      display: none;
      justify-content: center;
      align-items: center;
    }


    .message {
      margin-top: 20px;
      font-size: 16px;
      color: #555;
    }

    @media (max-width: 768px) {
      .main {
        margin-left: 0;
      }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
      }

      .nav-links a {
        margin: 5px 10px;
        padding: 10px;
      }

      .logo {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <img src="https://via.placeholder.com/150x60?text=Your+Logo" alt="Project Logo" />
    </div>
    <div class="nav-links">
      <a href="/viewDashboard">Dashboard</a>
      <a href="/viewVendors">Vendors</a>
      <a href="/viewInventory" class="active">Inventory</a>
      <a href="/viewOrders">Orders</a>
      <a href="/viewCustomer">CustomerOrders</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Items Dataset</h3>
        <button class="add-button" onclick="openAddForm()">+ Add</button>
      </div>
      <div id="itemsContainer">
        <p class="message">Loading items...</p>
      </div>
    </div>
  </div>

  <!-- Add Item Modal -->
  <div class="modal-overlay" id="addFormOverlay">
    <form class="modal-form" id="addForm" action="/addInventory" method="POST">
      <h3>Add Item</h3>
      <input type="text" name="item_name" placeholder="Item Name" required />
      <input type="number" name="qty" placeholder="Quantity" required />
      <input type="number" name="price" placeholder="Price" required />
      <input type="text" name="vendor_id" placeholder="Vendor ID" required />
      <div class="form-buttons">
        <button type="submit" class="save">Add</button>
        <button type="button" class="cancel" onclick="closeAddForm()">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Edit Item Modal -->
  <div class="modal-overlay" id="editFormOverlay">
    <form class="modal-form" id="editForm" action="/editInventory" method="POST">
      <h3>Edit Item</h3>
      <input type="text" name="item_id" readonly />
      <input type="text" name="item_name" required />
      <input type="number" name="qty" required />
      <input type="number" name="price" required />
      <input type="text" name="vendor_id" readonly />
      <div class="form-buttons">
        <button type="submit" class="save">Update</button>
        <button type="button" class="cancel" onclick="closeEditForm()">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Order Item Modal -->
  <div class="modal-overlay" id="orderFormOverlay">
    <form class="modal-form" id="orderForm">
      <h3>Order Item</h3>
      <input type="text" name="item_id" readonly />
      <input type="number" name="qty" placeholder="Order Quantity" required />
      <input type="text" name="vendor_id" readonly />
      <div class="form-buttons">
        <button type="submit" class="save">Order</button>
        <button type="button" class="cancel" onclick="closeOrderForm()">Cancel</button>
      </div>
    </form>
  </div>

  <script>
  const baseUrl = "http://192.168.181.241:4003";

  async function fetchItems() {
    const container = document.getElementById('itemsContainer');
    container.innerHTML = '<p class="message">Loading items...</p>';

    try {
      const response = await fetch(`${baseUrl}/api/items`);
      const items = await response.json();

      if (!items || !Array.isArray(items)) {
        container.innerHTML = '<p class="message">No items found.</p>';
        return;
      }

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = `
        <tr>
          <th>item_id</th>
          <th>item_name</th>
          <th>qty</th>
          <th>price</th>
          <th>vendor_id</th>
          <th>Action</th>
        </tr>
      `;
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      items.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.item_id}</td>
          <td>${item.item_name}</td>
          <td>${item.qty}</td>
          <td>${item.price}</td>
          <td>${item.vendor_id}</td>
          <td>
            <button class="action-button order" onclick="openOrderForm('${item.item_id}', '${item.vendor_id}')">Order</button>
            <button class="action-button edit" onclick='openEditForm(${JSON.stringify(item)})'>Edit</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      container.innerHTML = '';
      container.appendChild(table);
    } catch (error) {
      container.innerHTML = `<p class="message">Error fetching items: ${error.message}</p>`;
    }
  }

  // ---- MODAL CONTROLS ---- //
  function openAddForm() {
    document.getElementById('addFormOverlay').style.display = 'flex';
  }

  function closeAddForm() {
    document.getElementById('addFormOverlay').style.display = 'none';
    document.getElementById('addForm').reset();
  }

  function openEditForm(item) {
    const form = document.getElementById('editForm');
    form.item_id.value = item.item_id;
    form.item_name.value = item.item_name;
    form.qty.value = item.qty;
    form.price.value = item.price;
    form.vendor_id.value = item.vendor_id;
    document.getElementById('editFormOverlay').style.display = 'flex';
  }

  function closeEditForm() {
    document.getElementById('editFormOverlay').style.display = 'none';
  }

  function openOrderForm(item_id, vendor_id) {
    const form = document.getElementById('orderForm');
    form.item_id.value = item_id;
    form.qty.value = '';
    form.vendor_id.value = vendor_id;
    document.getElementById('orderFormOverlay').style.display = 'flex';
  }

  function closeOrderForm() {
    document.getElementById('orderFormOverlay').style.display = 'none';
  }

  // ---- FORM SUBMIT HANDLERS ---- //

  // ✅ Add Inventory Handler
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const form = e.target;
    const item_name = form.item_name.value.trim();
    const qty = parseInt(form.qty.value);
    const price = parseFloat(form.price.value);
    const vendor_id = form.vendor_id.value.trim();

    if (!item_name || isNaN(qty) || isNaN(price) || qty <= 0 || price <= 0 || !vendor_id) {
      alert('Please enter valid item information.');
      return;
    }

    try {
      const response = await fetch(`${baseUrl}/addInventory`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_name, qty, price, vendor_id })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || 'Add item failed');
      }

      closeAddForm();
      fetchItems();
    } catch (err) {
      alert(`Error: ${err.message}`);
    }
  });

  // ✅ Order Inventory Handler
  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const form = e.target;
    const item_id = form.item_id.value.trim();
    const qty = parseInt(form.qty.value);
    const vendor_id = form.vendor_id.value.trim();

    if (!item_id || isNaN(qty) || qty <= 0 || !vendor_id) {
      alert('Invalid order information.');
      return;
    }

    try {
      const response = await fetch(`${baseUrl}/orderInventory`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id, qty, vendor_id })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || 'Order failed');
      }

      closeOrderForm();
      fetchItems();
    } catch (err) {
      alert(`Error: ${err.message}`);
    }
  });

  document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;

    const item_id = form.item_id.value.trim();
    const item_name = form.item_name.value.trim();
    const qty = parseInt(form.qty.value);
    const price = parseFloat(form.price.value);

    if (!item_id || !item_name || isNaN(qty) || qty < 0 || isNaN(price) || price < 0) {
      alert("Please fill in all fields correctly.");
      return;
    }

    try {
      const response = await fetch(`${baseUrl}/editInventory`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item_id, item_name, qty, price })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "Failed to update item.");
      }

      closeEditForm();
      fetchItems(); // Refresh item list

    } catch (error) {
      alert("Error: " + error.message);
    }
  });

  // Load items on page load
  window.onload = fetchItems;
</script>


</body>
</html>
