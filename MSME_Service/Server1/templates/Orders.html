<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard - Orders</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      min-height: 100vh;
      background-color: #f0f2f5;
    }
    .sidebar {
      width: 220px;
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      position: fixed;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 100%;
      text-align: center;
      margin-bottom: 40px;
    }
    .logo img {
      max-width: 100%;
      height: 60px;
      object-fit: contain;
    }
    .nav-links {
      width: 100%;
    }
    .nav-links a {
      display: block;
      color: #ecf0f1;
      text-decoration: none;
      padding: 12px 20px;
      margin-bottom: 10px;
      border-radius: 4px;
      transition: 0.3s;
    }
    .nav-links a:hover {
      background-color: #34495e;
    }
    .active {
      background-color: #34495e;
    }
    .main {
      margin-left: 220px;
      padding: 20px;
      flex-grow: 1;
    }
    .card {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .card h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      min-width: 600px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ccc;
    }
    th {
      background-color: #ecf0f1;
    }
    button {
      padding: 6px 12px;
      border: none;
      background-color: #3498db;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #2980b9;
    }
    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    @media (max-width: 768px) {
      .main {
        margin-left: 0;
      }
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
      }
      .nav-links a {
        margin: 5px 10px;
        padding: 10px;
      }
      .logo {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <img src="https://via.placeholder.com/150x60?text=Your+Logo" alt="Project Logo" />
    </div>

    <div class="nav-links">
      <a href="/viewDashboard">Dashboard</a>
      <a href="/viewVendors">Vendors</a>
      <a href="/viewInventory">Inventory</a>
      <a href="/viewOrders" class="active">Orders</a>
      <a href="/viewCustomer">CustomerOrders</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="card full-width">
      <h3>Order Dataset</h3>
      <div id="order-table-container">
        <p>Loading orders...</p>
      </div>
    </div>
  </div>

  <script>
    const BASE_API_URL = "http://192.168.181.241:4001/api";

    async function fetchApiData(endpoint) {
      try {
        const response = await fetch(`${BASE_API_URL}/${endpoint}`);
        if (!response.ok) {
          throw new Error(`Failed to fetch ${endpoint}: ${response.statusText}`);
        }
        return await response.json();
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    function escapeHtml(text) {
      if (text === undefined || text === null) return '-';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function createOrderTable(orders) {
      if (!orders || orders.length === 0) {
        return '<p>No orders found or failed to fetch data.</p>';
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Item ID</th>
              <th>Qty</th>
              <th>Vendor ID</th>
              <th>Order Date</th>
              <th>Received Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
      `;

      orders.forEach(order => {
        const isReceived = order.received_date !== null && order.received_date !== "" && order.received_date !== "None";

        html += `
          <tr>
            <td>${escapeHtml(order.order_id)}</td>
            <td>${escapeHtml(order.item_id)}</td>
            <td>${escapeHtml(order.qty)}</td>
            <td>${escapeHtml(order.vendor_id)}</td>
            <td>${escapeHtml(order.order_date)}</td>
            <td>${escapeHtml(order.received_date)}</td>
            <td>
              <form action="/receivedOrder" method="POST">
                <input type="hidden" name="order_id" value="${escapeHtml(order.order_id)}">
                <input type="hidden" name="item_id" value="${escapeHtml(order.item_id)}">
                <button type="submit" ${isReceived ? 'disabled' : ''}>Received</button>
              </form>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;

      return html;
    }

    async function loadData() {
      const container = document.getElementById('order-table-container');
      container.innerHTML = '<p>Loading orders...</p>';

      const [vendors, items, orders] = await Promise.all([
        fetchApiData('vendors'),
        fetchApiData('items'),
        fetchApiData('orders')
      ]);

      if (!orders) {
        container.innerHTML = '<p>Failed to load orders data.</p>';
        return;
      }

      container.innerHTML = createOrderTable(orders);
    }

    window.onload = loadData;
  </script>

</body>
</html>
