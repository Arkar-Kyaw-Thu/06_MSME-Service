<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Page with Quantity Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background-color: #333;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
    }
    .navbar .logo {
      display: flex;
      align-items: center;
    }
    .navbar .logo img {
      height: 40px;
      margin-right: 10px;
    }
    .navbar .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .navbar .right button {
      border: none;
      padding: 8px 14px;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    .cart-btn {
      background-color: #0077cc;
    }
    .quit-btn {
      background-color: #ff4d4d;
    }
    .main-content {
      flex: 1;
      padding-top: 70px;
    }
    .card-container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .card h3 {
      margin: 10px 0 5px;
    }
    .card .price {
      color: #2a9d8f;
      font-weight: bold;
      margin: 5px 0;
    }
    .card .stock {
      margin-bottom: 10px;
    }
    .add-to-cart {
      padding: 10px;
      background-color: #ffd166;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background-color 0.2s;
    }
    .add-to-cart:hover {
      background-color: #f5c441;
    }
    .cart-panel {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 320px;
      max-height: 400px;
      background-color: white;
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1001;
    }
    .cart-panel h3 {
      margin-bottom: 10px;
    }
    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .cart-item-name {
      flex: 1;
      margin-right: 8px;
    }
    .cart-qty-input {
      width: 50px;
      padding: 3px 5px;
      font-size: 14px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .cart-total {
      margin-top: 10px;
      font-weight: bold;
      text-align: right;
      font-size: 16px;
    }
    .order-btn {
      margin-top: 15px;
      width: 100%;
      background-color: #28a745;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">
    <img src="https://via.placeholder.com/40" alt="Logo" />
    <span>Project Name</span>
  </div>
  <div class="right">
    <span>Welcome</span>
    <button class="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
    <a href="http://192.168.181.16:5000/"><button class="quit-btn">Quit</button></a>
  </div>
</div>

<!-- Floating Cart Panel -->
<div class="cart-panel" id="cartPanel">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <div class="cart-total" id="cartTotal">Total: $0.00</div>
  <button class="order-btn" onclick="order()">Order</button>
</div>

<!-- Main -->
<div class="main-content">
  <div class="card-container">
    <div class="card-grid" id="productGrid">
      <!-- Products will be loaded here dynamically -->
    </div>
  </div>
</div>

<!-- Footer -->
<footer>
  &copy; 2025 Your Company Name. All rights reserved.
</footer>

<script>
  const API_URL = "http://192.168.181.241:4001/api/items";
  const productGrid = document.getElementById("productGrid");
  const cartPanel = document.getElementById("cartPanel");
  const cartItemsDiv = document.getElementById("cartItems");
  const cartTotalDiv = document.getElementById("cartTotal");
  const cartCountSpan = document.getElementById("cartCount");

  let cart = [];

  window.onload = () => {
    const storedCart = localStorage.getItem("cart");
    if (storedCart) {
      cart = JSON.parse(storedCart);
      renderCart();
    }
    fetchProducts();
  };

  async function fetchProducts() {
    try {
      const response = await fetch(API_URL);
      const items = await response.json();
      renderProducts(items);
    } catch (error) {
      productGrid.innerHTML = `<p>Error fetching products.</p>`;
      console.error("API fetch error:", error);
    }
  }

  function renderProducts(items) {
    if (!Array.isArray(items) || items.length === 0) {
      productGrid.innerHTML = `<p>No items found.</p>`;
      return;
    }

    productGrid.innerHTML = "";

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h3>${item.item_name}</h3>
        <p class="price">$${item.price.toFixed(2)}</p>
        <p class="stock">In stock: ${item.qty}</p>
        <button 
          class="add-to-cart"
          data-itemid="${item.item_id}"
          data-name="${item.item_name}"
          data-price="${item.price}"
          data-qty="${item.qty}"
        >Add to Cart</button>
      `;
      productGrid.appendChild(card);
    });
  }

  productGrid.addEventListener('click', e => {
    if (e.target.classList.contains('add-to-cart')) {
      const btn = e.target;
      const item = {
        itemId: btn.dataset.itemid,
        name: btn.dataset.name,
        price: Number(btn.dataset.price),
        qty: Number(btn.dataset.qty)
      };
      addToCart(item);
    }
  });

  function toggleCart() {
    cartPanel.style.display = cartPanel.style.display === "block" ? "none" : "block";
  }

  function addToCart(item) {
    const existing = cart.find(i => i.itemId === item.itemId);
    if (existing) {
      if (existing.qtyInCart < item.qty) {
        existing.qtyInCart++;
      } else {
        alert("Cannot add more than available stock.");
        return;
      }
    } else {
      cart.push({
        itemId: item.itemId,
        name: item.name,
        price: item.price,
        qtyInCart: 1,
        qty: item.qty
      });
    }
    saveCart();
    renderCart();
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    saveCart();
    renderCart();
  }

  cartItemsDiv.addEventListener('input', e => {
    if (e.target.classList.contains('cart-qty-input')) {
      const index = Number(e.target.dataset.index);
      let newQty = parseInt(e.target.value, 10);

      if (isNaN(newQty) || newQty < 0) {
        newQty = 0;
      }

      const item = cart[index];
      if (!item) return;

      if (newQty > item.qty) {
        alert(`Cannot exceed available stock: ${item.qty}`);
        newQty = item.qty;
        e.target.value = newQty;
      }

      if (newQty === 0) {
        removeFromCart(index);
      } else {
        item.qtyInCart = newQty;
        saveCart();
        renderCart();
      }
    }
  });

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  function renderCart() {
    cartItemsDiv.innerHTML = "";
    let total = 0;
    let totalQty = 0;

    cart.forEach((item, index) => {
      total += item.price * item.qtyInCart;
      totalQty += item.qtyInCart;

      const div = document.createElement("div");
      div.className = "cart-item";
      div.innerHTML = `
        <div class="cart-item-name">${item.name} - $${item.price.toFixed(2)}</div>
        <input
          type="number"
          min="0"
          max="${item.qty}"
          class="cart-qty-input"
          data-index="${index}"
          value="${item.qtyInCart}"
          title="Change quantity"
        />
        <button onclick="removeFromCart(${index})" title="Remove item">✖</button>
      `;
      cartItemsDiv.appendChild(div);
    });

    cartTotalDiv.innerText = "Total: $" + total.toFixed(2);
    cartCountSpan.innerText = totalQty;

    if (cart.length === 0) {
      cartPanel.style.display = "none";
    }
  }

  function order() {
    if (cart.length === 0) {
      alert("Your cart is empty!");
      return;
    }

    const cartForPayment = cart.map(item => ({
      itemId: item.itemId,
      name: item.name,
      price: item.price,
      qtyInCart: item.qtyInCart
    }));

    localStorage.setItem("cartForPayment", JSON.stringify(cartForPayment));
    window.location.href = "/payment";
  }
</script>

</body>
</html>
