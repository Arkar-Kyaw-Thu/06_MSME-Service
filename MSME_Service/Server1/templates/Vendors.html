<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Vendors</title>
  <style>
    /* Styles (same as before for sidebar, main, table, modals, etc.) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background-color: #f0f2f5;
    }

    .sidebar {
      width: 220px;
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      position: fixed;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 100%;
      text-align: center;
      margin-bottom: 40px;
    }

    .logo img {
      max-width: 100%;
      height: 60px;
      object-fit: contain;
    }

    .nav-links {
      width: 100%;
    }

    .nav-links a {
      display: block;
      color: #ecf0f1;
      text-decoration: none;
      padding: 12px 20px;
      margin-bottom: 10px;
      border-radius: 4px;
      transition: 0.3s;
    }

    .nav-links a:hover, .active {
      background-color: #34495e;
    }

    .main {
      margin-left: 220px;
      padding: 20px;
      flex-grow: 1;
    }

    .card {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .add-button {
      float: right;
      padding: 6px 12px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-button:hover {
      background-color: #27ae60;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ccc;
      white-space: nowrap;
    }

    th {
      background-color: #ecf0f1;
    }

    .action-button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: white;
      margin-right: 5px;
    }

    .action-button.remove {
      background-color: #e74c3c;
    }

    .action-button.edit {
      background-color: #f39c12;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-form {
      background: #fff;
      width: 400px;
      max-width: 90%;
      margin: 100px auto;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .modal-form h3 {
      margin-bottom: 15px;
      font-size: 20px;
      color: #2c3e50;
    }

    .modal-form input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .modal-form .form-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-form button {
      padding: 10px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal-form .save {
      background-color: #3498db;
      color: white;
    }

    .modal-form .cancel {
      background-color: #e74c3c;
      color: white;
    }

    @media (max-width: 768px) {
      .main {
        margin-left: 0;
      }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
      }

      .nav-links a {
        margin: 5px 10px;
        padding: 10px;
      }

      .logo {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <img src="https://via.placeholder.com/150x60?text=Your+Logo" alt="Project Logo" />
    </div>
    <div class="nav-links">
      <a href="/viewDashboard">Dashboard</a>
      <a href="/viewVendors" class="active">Vendors</a>
      <a href="/viewInventory">Inventory</a>
      <a href="/viewOrders">Orders</a>
      <a href="/viewCustomer">CustomerOrders</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Vendors Dataset</h3>
        <button class="add-button" onclick="openAddForm()">+ Add</button>
      </div>

      <table id="vendorsTable">
        <thead>
          <tr>
            <th>vendor_id</th>
            <th>vendor_name</th>
            <th>contact</th>
            <th>location</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="noData" style="display:none; margin-top: 15px;">No vendors found or failed to fetch data.</p>
    </div>
  </div>

  <!-- Add Form Modal -->
  <div class="modal-overlay" id="addFormOverlay">
    <form class="modal-form" id="addForm" action="/addVendors" method="POST">
      <h3>Add Vendor</h3>
      <input type="text" name="vendor_name" placeholder="Vendor Name" required />
      <input type="text" name="contact" placeholder="Contact" required />
      <input type="text" name="location" placeholder="Location" required />
      <div class="form-buttons">
        <button type="submit" class="save">Add</button>
        <button type="button" class="cancel" onclick="closeAddForm()">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Edit Form Modal -->
  <div class="modal-overlay" id="editFormOverlay">
    <form class="modal-form" id="editForm" action="/editVendors" method="POST">
      <h3>Edit Vendor</h3>
      <input type="text" name="vendor_id" placeholder="Vendor ID" readonly />
      <input type="text" name="vendor_name" placeholder="Vendor Name" required />
      <input type="text" name="contact" placeholder="Contact" required />
      <input type="text" name="location" placeholder="Location" required />
      <div class="form-buttons">
        <button type="submit" class="save">Update</button>
        <button type="button" class="cancel" onclick="closeEditForm()">Cancel</button>
      </div>
    </form>
  </div>

  <!-- JavaScript -->
  <script>
    const API_BASE = 'http://192.168.181.241:4001';
    let currentEditId = null;

    async function fetchVendors() {
      try {
        const res = await fetch(`${API_BASE}/api/vendors`);
        const vendors = await res.json();
        const tbody = document.querySelector('#vendorsTable tbody');
        tbody.innerHTML = '';

        if (!vendors.length) {
          document.getElementById('noData').style.display = 'block';
          return;
        }

        document.getElementById('noData').style.display = 'none';

        vendors.forEach(vendor => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${vendor.vendor_id}</td>
            <td>${vendor.vendor_name}</td>
            <td>${vendor.contact}</td>
            <td>${vendor.location}</td>
            <td>
              <button class="action-button edit" onclick='openEditForm(${JSON.stringify(vendor)})'>Edit</button>
              <form method="POST" action="${API_BASE}/removeVendors" style="display:inline;">
                <input type="hidden" name="vendor_id" value="${vendor.vendor_id}" />
                <button class="action-button remove" type="submit">Remove</button>
              </form>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        document.getElementById('noData').style.display = 'block';
      }
    }

    function openAddForm() {
      document.getElementById('addFormOverlay').style.display = 'block';
    }

    function closeAddForm() {
      document.getElementById('addFormOverlay').style.display = 'none';
      document.getElementById('addForm').reset();
    }

    function openEditForm(vendor) {
      currentEditId = vendor.vendor_id;
      document.querySelector('#editForm input[name="vendor_id"]').value = vendor.vendor_id;
      document.querySelector('#editForm input[name="vendor_name"]').value = vendor.vendor_name;
      document.querySelector('#editForm input[name="contact"]').value = vendor.contact;
      document.querySelector('#editForm input[name="location"]').value = vendor.location;
      document.getElementById('editFormOverlay').style.display = 'block';
    }

    function closeEditForm() {
      document.getElementById('editFormOverlay').style.display = 'none';
      document.getElementById('editForm').reset();
    }

    // Submit Add Vendor
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = {
        vendor_name: form.vendor_name.value,
        contact: form.contact.value,
        location: form.location.value
      };
      try {
        const res = await fetch(`${API_BASE}/addVendors`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          closeAddForm();
          fetchVendors();
        } else {
          const error = await res.json();
          alert('Error: ' + error.error);
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    // Submit Edit Vendor
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = {
        vendor_id: form.vendor_id.value,
        vendor_name: form.vendor_name.value,
        contact: form.contact.value,
        location: form.location.value
      };
      try {
        const res = await fetch(`${API_BASE}/editVendors`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          closeEditForm();
          fetchVendors();
        } else {
          const error = await res.json();
          alert('Error: ' + error.error);
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    fetchVendors();
  </script>

</body>
</html>
